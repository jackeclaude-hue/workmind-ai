<style>
/* ==========================================================================
   WorkMind AI · Design System
   Layout: una columna central (720 px en Bienvenida/Cuestionario, 960 px en
   Dashboard) dentro de un único contenedor dinámico #app.
   Tema oscuro único por decisión de marca (fondo slate + acento violeta).
   ========================================================================== */
:root {
  color-scheme: dark;

  /* Color */
  --bg:          #0f172a;   /* fondo de la aplicación */
  --surface:     #1e293b;   /* tarjetas */
  --surface-2:   #273449;   /* superficies elevadas / hover */
  --line:        #334155;   /* bordes */
  --text:        #f1f5f9;   /* texto principal */
  --muted:       #94a3b8;   /* texto secundario */
  --accent:      #8b5cf6;   /* violeta de marca */
  --accent-soft: rgba(139, 92, 246, 0.14);
  --accent-ink:  #c4b5fd;   /* violeta legible sobre fondo oscuro */

  /* Color semántico por nivel de madurez */
  --lvl-low:  #ef4444;      /* Inicial */
  --lvl-mid:  #f59e0b;      /* En desarrollo */
  --lvl-high: #10b981;      /* Optimizado */

  /* Tipografía */
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body:    "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-data:    "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  /* Escala tipográfica */
  --fs-xs: 0.75rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.375rem;
  --fs-2xl: clamp(1.75rem, 4.2vw, 2.75rem);
  --fs-num: clamp(3.25rem, 9vw, 4.5rem);

  /* Espaciado (base 8 px), radios y movimiento */
  --sp-1: 0.5rem; --sp-2: 1rem; --sp-3: 1.5rem; --sp-4: 2rem; --sp-5: 3rem;
  --radius-sm: 10px; --radius: 16px; --radius-pill: 999px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --t-fast: 160ms; --t-view: 240ms;
}

*, *::before, *::after { box-sizing: border-box; }

html { background: var(--bg); }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(900px 480px at 85% -10%, rgba(139, 92, 246, 0.10), transparent 70%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--fs-md);
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- Estructura global ---------- */
.site-header, .site-footer {
  width: 100%; max-width: 960px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2);
}
.site-header { padding-block: var(--sp-3) var(--sp-2); }
.site-footer {
  padding-block: var(--sp-4) var(--sp-3);
  color: var(--muted); font-size: var(--fs-sm); justify-content: center; text-align: center;
}

.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: var(--fs-lg); }
.brand svg { flex: none; }
.brand b { color: var(--accent-ink); font-weight: 600; }
.header-tag {
  font-family: var(--font-data); font-size: var(--fs-xs); color: var(--muted);
  border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 4px 10px;
}

#app { flex: 1; width: 100%; max-width: 960px; margin: 0 auto; padding-block: var(--sp-3); }
#app:focus { outline: none; }

.view { animation: view-in var(--t-view) var(--ease) both; }
@keyframes view-in { from { opacity: 0.001; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.eyebrow {
  font-family: var(--font-data); font-size: var(--fs-xs); font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-ink);
}

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 0 22px; border-radius: 12px; border: 1px solid transparent;
  font: 600 var(--fs-md)/1 var(--font-body); cursor: pointer;
  transition: background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease), opacity var(--t-fast);
}
.btn svg { flex: none; }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 8px 24px -10px rgba(139, 92, 246, 0.75); }
.btn-primary:hover { background: #7c4ff0; transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-primary[aria-disabled="true"] { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-lg { min-height: 56px; padding: 0 28px; font-size: var(--fs-lg); }

/* ==========================================================================
   VISTA 1 · Bienvenida
   ========================================================================== */
.hero { display: grid; gap: var(--sp-5); align-items: center; padding-block: var(--sp-3) var(--sp-4); }
.hero-copy { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
.hero h1 { font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -0.02em; }
.hero h1 em { font-style: normal; color: var(--accent-ink); }
.lede { color: var(--muted); font-size: var(--fs-lg); max-width: 52ch; }
.lede strong { color: var(--text); font-weight: 700; }

.benefits { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--sp-1); }
.benefits li {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
  font-size: var(--fs-sm); font-weight: 500;
}
.benefits .ico {
  flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent-ink);
}

.cta-row { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
.trust { color: var(--muted); font-size: var(--fs-sm); display: flex; flex-wrap: wrap; gap: 6px 14px; }
.trust span { display: inline-flex; align-items: center; gap: 6px; }
.trust span::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--lvl-high); }

/* Vista previa del reporte (muestra qué entrega la herramienta) */
.preview {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2);
  box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.6); min-width: 0;
}
.preview-head { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-1); }
.preview-tag { font-size: var(--fs-xs); color: var(--muted); font-family: var(--font-data); }
.preview-score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.preview-score .num { font-family: var(--font-data); font-size: 2.75rem; font-weight: 600; letter-spacing: -0.03em; }
.dim-rows { display: grid; gap: 10px; }
.dim-row { display: grid; grid-template-columns: 7.5rem 1fr 2.75rem; align-items: center; gap: 10px; font-size: var(--fs-sm); }
.dim-row .val { font-family: var(--font-data); font-size: var(--fs-xs); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.mini-track { height: 6px; border-radius: 99px; background: var(--bg); overflow: hidden; }
.mini-fill { height: 100%; border-radius: inherit; }
.preview-note { font-size: var(--fs-xs); color: var(--muted); border-top: 1px dashed var(--line); padding-top: 12px; }

/* ==========================================================================
   VISTA 2 · Cuestionario
   ========================================================================== */
.quiz { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--sp-3); }

.progress-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-2); font-size: var(--fs-sm); color: var(--muted); }
.progress-head strong { color: var(--text); font-weight: 600; }
.progress-head .pct { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.progress-track { height: 8px; background: var(--surface); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.progress-fill {
  height: 100%; border-radius: inherit; width: 0;
  background: linear-gradient(90deg, #7c3aed, var(--accent) 60%, #a78bfa);
  transition: width 300ms var(--ease);
}
.steps-dots { display: flex; gap: 6px; margin-top: 10px; }
.steps-dots span { flex: 1; height: 3px; border-radius: 2px; background: var(--line); transition: background var(--t-fast); }
.steps-dots span.done { background: var(--accent); }

.q-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: var(--sp-4) var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-3);
}
.q-card fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-3); }
.dim-chip {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-data); font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--accent-ink); background: var(--accent-soft); padding: 6px 10px; border-radius: var(--radius-pill);
}
.q-card legend { padding: 0; font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 600; line-height: 1.3; text-wrap: balance; }
.q-hint { color: var(--muted); font-size: var(--fs-sm); margin-top: -8px; }

.options { display: grid; gap: 10px; }
.option { position: relative; display: block; cursor: pointer; }
.option input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.option .box {
  display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 14px 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
  transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.option .radio {
  flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line);
  display: grid; place-items: center; transition: border-color var(--t-fast), background var(--t-fast);
}
.option .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; transform: scale(0); transition: transform var(--t-fast) var(--ease); }
.option .txt { font-weight: 500; min-width: 0; }
.option:hover .box { border-color: #475569; background: var(--surface-2); }
.option input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
.option input:checked + .box { border-color: var(--accent); background: var(--accent-soft); }
.option input:checked + .box .radio { border-color: var(--accent); background: var(--accent); }
.option input:checked + .box .radio::after { transform: scale(1); }

.q-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.q-nav .spacer { flex: 1; }

/* ==========================================================================
   VISTA 3 · Dashboard de resultados
   ========================================================================== */
.results { display: flex; flex-direction: column; gap: var(--sp-3); }
.results-top { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--sp-2); flex-wrap: wrap; }
.results-top h1 { font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -0.02em; }
.elapsed { font-family: var(--font-data); font-size: var(--fs-xs); color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 6px 12px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--sp-3); min-width: 0; }

.score-panel { display: grid; gap: var(--sp-3); align-items: center; }
.gauge { position: relative; width: 168px; height: 168px; margin: 0 auto; }
.gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.gauge .g-track { stroke: var(--bg); }
.gauge .g-fill { transition: stroke-dashoffset 900ms var(--ease); }
.gauge-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.gauge-num { font-family: var(--font-data); font-size: var(--fs-num); font-weight: 600; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.gauge-num small { font-size: 0.42em; color: var(--muted); margin-left: 2px; }

.score-body { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.badge {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-data); font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 7px 14px; border-radius: var(--radius-pill); border: 1px solid currentColor;
}
.badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.diag { font-size: var(--fs-lg); }
.level-bar { position: relative; }
.level-track { height: 12px; border-radius: 99px; background: var(--bg); overflow: hidden; }
.level-fill { height: 100%; width: 0; border-radius: inherit; transition: width 700ms var(--ease); }
.level-scale { display: grid; grid-template-columns: 40fr 35fr 25fr; margin-top: 8px; font-family: var(--font-data); font-size: var(--fs-xs); color: var(--muted); }
.level-scale span { border-left: 1px solid var(--line); padding-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.findings { display: grid; gap: var(--sp-3); }
.finding h2 { font-size: var(--fs-lg); font-weight: 600; display: flex; align-items: center; gap: 10px; margin-bottom: var(--sp-2); }
.finding h2 .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.finding ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.finding li { display: grid; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.finding li:last-child { border-bottom: 0; padding-bottom: 0; }
.finding .f-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.finding .f-name { font-weight: 700; }
.finding .f-val { font-family: var(--font-data); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; flex: none; }
.finding .f-txt { color: var(--muted); font-size: var(--fs-sm); }
.f-tag { font-family: var(--font-data); font-size: 0.6875rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: var(--radius-pill); border: 1px solid currentColor; margin-left: 8px; }
.empty { color: var(--muted); font-size: var(--fs-sm); font-style: italic; }

.roadmap h2 { font-size: var(--fs-xl); font-weight: 600; margin-bottom: 6px; }
.roadmap > p { color: var(--muted); font-size: var(--fs-sm); margin-bottom: var(--sp-3); }
.road { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--sp-2); counter-reset: step; }
.road li {
  position: relative; display: flex; flex-direction: column; gap: 8px; padding: var(--sp-3) var(--sp-2) var(--sp-2);
  border: 1px solid var(--line); border-radius: 12px; background: var(--bg); min-width: 0;
}
.road li.priority { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.road .n {
  font-family: var(--font-data); font-weight: 600; font-size: var(--fs-sm);
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); color: var(--text);
}
.road li.priority .n { background: var(--accent); color: #fff; }
.road h3 { font-size: var(--fs-md); font-weight: 600; }
.road p { color: var(--muted); font-size: var(--fs-sm); }
.road .start {
  position: absolute; top: -11px; right: 14px; background: var(--accent); color: #fff;
  font-family: var(--font-data); font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 3px 9px; border-radius: var(--radius-pill);
}

.results-actions { display: flex; justify-content: center; padding-top: var(--sp-1); }

/* ==========================================================================
   Responsivo
   ========================================================================== */
@media (min-width: 640px) {
  .cta-row { flex-direction: row; align-items: center; gap: var(--sp-2); }
  .benefits { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .benefits li { flex-direction: column; align-items: flex-start; }
  .findings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .score-panel { grid-template-columns: 180px minmax(0, 1fr); gap: var(--sp-4); }
  .q-card { padding: var(--sp-4); }
}
@media (min-width: 900px) {
  .hero { grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); }
  .benefits { grid-template-columns: 1fr; }
  .benefits li { flex-direction: row; align-items: center; }
  .road { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 639px) {
  .q-nav { flex-direction: column-reverse; align-items: stretch; }
  .q-nav .btn { width: 100%; }
  .q-nav .spacer { display: none; }
  .cta-row .btn { width: 100%; }
  .results-actions .btn { width: 100%; }
  .dim-row { grid-template-columns: 6.5rem 1fr 2.5rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}
</style>

  <div class="brand" aria-label="WorkMind AI">
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">

</footer>

<script>
'use strict';
/* ==========================================================================
   WorkMind AI · Motor de la SPA (JavaScript vanilla ES6+, sin dependencias)
   FN-01 Cuestionario · FN-02 Evaluación ponderada · FN-03 Dashboard · FN-04 Reinicio
   Sin llamadas de red, sin almacenamiento persistente, sin PII.
   ========================================================================== */

/* ---------- Datos: dimensiones de la hoja de ruta ---------- */
const DIMENSIONS = {
  centralizar: {
    step: 1,
    label: 'Centralizar',
    title: 'Centralizar tareas',
    action: 'Reúne tareas y documentos en una sola herramienta y un repositorio único compartido.',

    gap: 'Tareas y archivos dispersos generan búsquedas y pendientes olvidados.'
  },
  estandarizar: {
    step: 2,
    label: 'Estandarizar',
    title: 'Estandarizar documentos',
    action: 'Crea plantillas únicas y documenta paso a paso tus procesos clave.',
    strength: 'Plantillas y procesos documentados reducen el retrabajo.',
    gap: 'Cada documento y proceso depende de quien lo hace; hay retrabajo.'
  },
  automatizar: {
    step: 3,
    label: 'Automatizar',
    title: 'Automatizar procesos',
    action: 'Automatiza las tareas repetitivas e integra la IA en flujos ya definidos.',
    strength: 'Las tareas repetitivas ya no consumen tu jornada.',
    gap: 'Las tareas manuales repetitivas siguen consumiendo horas de la semana.'
  }
};

/* ---------- Datos: banco de preguntas (ponderación 0 / 5 / 10) ---------- */
const QUESTIONS = [
  { id: 'q1', dim: 'centralizar',
    text: '¿Dónde gestionas tus tareas y pendientes?',
    options: [
      { label: 'En la memoria, en papel o en el correo', value: 0 },
      { label: 'En varias apps que no están conectadas', value: 5 },
      { label: 'En una herramienta central compartida', value: 10 } ] },
  { id: 'q2', dim: 'centralizar',
    text: '¿Cuánto tardas en encontrar un documento de trabajo?',
    options: [
      { label: 'Más de 10 minutos, o a veces no lo encuentro', value: 0 },
      { label: 'Entre 2 y 10 minutos', value: 5 },
      { label: 'Menos de 2 minutos: todo está en un repositorio', value: 10 } ] },
  { id: 'q3', dim: 'estandarizar',
    text: '¿Usas plantillas para documentos recurrentes como propuestas o informes?',
    options: [
      { label: 'No, cada documento empieza de cero', value: 0 },
      { label: 'Algunas, pero cada persona usa las suyas', value: 5 },
      { label: 'Sí, plantillas únicas y compartidas', value: 10 } ] },
  { id: 'q4', dim: 'estandarizar',
    text: '¿Tus procesos clave están documentados paso a paso?',
    options: [
      { label: 'No, dependen de quien los hace', value: 0 },
      { label: 'Parcialmente, o están desactualizados', value: 5 },
      { label: 'Sí, documentados y vigentes', value: 10 } ] },
  { id: 'q5', dim: 'automatizar',
    text: '¿Qué parte de tu jornada se va en tareas manuales repetitivas?',
    options: [
      { label: 'Más del 40 %', value: 0 },
      { label: 'Entre el 15 % y el 40 %', value: 5 },
      { label: 'Menos del 15 %', value: 10 } ] },
  { id: 'q6', dim: 'automatizar',
    text: '¿Cómo usas la inteligencia artificial en tu trabajo diario?',
    options: [
      { label: 'No la uso', value: 0 },
      { label: 'De forma ocasional y aislada', value: 5 },
      { label: 'Integrada en flujos de trabajo definidos', value: 10 } ] }
];

const MAX_SCORE = QUESTIONS.length * 10;      // 60 puntos

/* ---------- Rangos de madurez (PRD) ---------- */
const LEVELS = [
  { min: 75, key: 'high', label: 'Optimizado',    color: 'var(--lvl-high)',
    message: 'Operación madura. El siguiente salto es escalar con automatización e IA integrada.' },
  { min: 40, key: 'mid',  label: 'En desarrollo', color: 'var(--lvl-mid)',
    message: 'Tienes bases digitales. Falta estandarizar y conectar para dejar de apagar incendios.' },
  { min: 0,  key: 'low',  label: 'Inicial',       color: 'var(--lvl-low)',
    message: 'Tu operación depende del esfuerzo manual. Hay mucho tiempo por recuperar.' }
];

/* ---------- Estado en memoria (se pierde al cerrar la pestaña) ---------- */
const initialState = () => ({
  view: 'welcome',                         // 'welcome' | 'quiz' | 'results'
  currentIndex: 0,                         // pregunta activa
  answers: new Array(QUESTIONS.length).fill(null), // valores 0 | 5 | 10 | null
  startedAt: null,
  finishedAt: null
});
let state = initialState();
let isTransitioning = false;
const app = document.getElementById('app');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ==========================================================================
   FN-02 · Algoritmo de evaluación ponderada (síncrono)
   ========================================================================== */
function evaluate(answers) {
  const total = answers.reduce((sum, v) => sum + (v || 0), 0);
  const percent = Math.round((total / MAX_SCORE) * 100);
  const level = LEVELS.find(l => percent >= l.min);

  // Puntaje por dimensión (cada dimensión tiene 2 preguntas → máx. 20)
  const dims = Object.keys(DIMENSIONS).map(key => {
    const idx = QUESTIONS.map((q, i) => (q.dim === key ? i : -1)).filter(i => i >= 0);
    const got = idx.reduce((s, i) => s + (answers[i] || 0), 0);
    const pct = Math.round((got / (idx.length * 10)) * 100);
    return { key, pct, ...DIMENSIONS[key] };
  });

  const strengths = dims.filter(d => d.pct >= 75);
  const opportunities = dims.filter(d => d.pct < 75).sort((a, b) => a.pct - b.pct || a.step - b.step);
  const priority = opportunities.length ? opportunities[0].key : null;

  return { total, percent, level, dims, strengths, opportunities, priority };
}

/* ==========================================================================
   Router de vistas: un solo contenedor (#app) re-renderizado
   ========================================================================== */
function setView(view) {
  state.view = view;
  render();
}

function render() {
  if (state.view === 'welcome') app.innerHTML = viewWelcome();
  if (state.view === 'quiz')    app.innerHTML = viewQuiz();
  if (state.view === 'results') { app.innerHTML = viewResults(); animateResults(); }
  focusHeading();
}

function focusHeading() {
  const h = app.querySelector('[data-focus]');
  if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
}

/* ---------- Iconos (SVG en línea, decorativos) ---------- */

  gauge: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/></svg>',
  route: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 18h8a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h8"/></svg>',
  arrowR: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  arrowL: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  reset:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>'
};

   VISTA 1 · Bienvenida
   ========================================================================== */

/* ==========================================================================
   VISTA 2 · Cuestionario (FN-01)
   ========================================================================== */
function viewQuiz() {
  const i = state.currentIndex;
  const q = QUESTIONS[i];
  const total = QUESTIONS.length;
  const progress = Math.round(((i + 1) / total) * 100);
  const selected = state.answers[i];
  const isLast = i === total - 1;
  const canNext = selected !== null;

  return `
  <section class="view quiz" aria-labelledby="q-legend">
    <div>
      <div class="progress-head">
        <span><strong>Pregunta ${i + 1}</strong> de ${total}</span>
        <span class="pct">${progress}%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Progreso del cuestionario"
           aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${i + 1}">
        <div class="progress-fill" id="progress-fill" style="width:${Math.round(((selected !== null ? i + 1 : i) / total) * 100)}%"></div>
      </div>
      <div class="steps-dots" aria-hidden="true">
        ${QUESTIONS.map((_, k) => `<span class="${state.answers[k] !== null ? 'done' : ''}"></span>`).join('')}
      </div>
    </div>

    <form class="q-card" id="q-form" novalidate>
      <fieldset role="radiogroup" aria-describedby="q-hint">
        <span class="dim-chip">Paso ${DIMENSIONS[q.dim].step} · ${DIMENSIONS[q.dim].label}</span>
        <legend id="q-legend" data-focus>${q.text}</legend>
        <p class="q-hint" id="q-hint">Elige la opción que mejor describe tu situación actual.</p>
        <div class="options">
          ${q.options.map((o, k) => `
            <label class="option" for="${q.id}-opt${k}">
              <input type="radio" name="${q.id}" id="${q.id}-opt${k}" value="${o.value}" ${selected === o.value ? 'checked' : ''}>
              <span class="box"><span class="radio" aria-hidden="true"></span><span class="txt">${o.label}</span></span>
            </label>`).join('')}
        </div>
      </fieldset>

      <div class="q-nav">
        ${i > 0
          ? `<button type="button" class="btn btn-ghost" data-action="prev">${ICON.arrowL} Anterior</button>`
          : `<span class="spacer"></span>`}
        <button type="submit" class="btn btn-primary" id="btn-next" aria-disabled="${!canNext}">
          ${isLast ? 'Ver resultados' : 'Siguiente'} ${ICON.arrowR}
        </button>
      </div>
    </form>
  </section>`;
}

/* ==========================================================================
   VISTA 3 · Dashboard de resultados (FN-03)
   ========================================================================== */
function viewResults() {
  const r = evaluate(state.answers);
  const secs = Math.max(1, Math.round((state.finishedAt - state.startedAt) / 1000));
  const C = 2 * Math.PI * 70; // circunferencia del indicador circular

  const strengthsHTML = r.strengths.length
    ? r.strengths.map(d => `
      <li>
        <div class="f-head"><span class="f-name">${d.title}</span><span class="f-val" style="color:var(--lvl-high)">${d.pct}%</span></div>
        <p class="f-txt">${d.strength}</p>
      </li>`).join('')
    : `<li><p class="empty">Aún no hay una dimensión consolidada. Tu primer paso marcará la diferencia.</p></li>`;

  const oppsHTML = r.opportunities.length
    ? r.opportunities.map(d => {
        const critical = d.pct < 50;
        const color = critical ? 'var(--lvl-low)' : 'var(--lvl-mid)';
        return `
      <li>
        <div class="f-head">
          <span class="f-name">${d.title}<span class="f-tag" style="color:${color}">${critical ? 'Crítica' : 'En consolidación'}</span></span>
          <span class="f-val" style="color:${color}">${d.pct}%</span>
        </div>
        <p class="f-txt">${d.gap}</p>
      </li>`; }).join('')
    : `<li><p class="empty">Sin brechas críticas. Enfócate en la optimización continua.</p></li>`;

  const roadHTML = Object.entries(DIMENSIONS).map(([key, d]) => {
    const isPriority = key === r.priority;
    return `
      <li class="${isPriority ? 'priority' : ''}">
        ${isPriority ? '<span class="start">Empieza aquí</span>' : ''}
        <span class="n" aria-hidden="true">${d.step}</span>
        <h3>${d.step}. ${d.title}</h3>
        <p>${d.action}</p>
      </li>`;
  }).join('');

  return `
  <section class="view results" aria-labelledby="res-title">
    <div class="results-top">
      <div>
        <p class="eyebrow">Tu diagnóstico</p>
        <h1 id="res-title" data-focus>Madurez digital: ${r.percent}%, nivel ${r.level.label}</h1>
      </div>
      <span class="elapsed">Completado en ${secs} s</span>
    </div>

    <div class="panel score-panel" data-percent="${r.percent}">
      <div class="gauge" aria-hidden="true">
        <svg viewBox="0 0 160 160">
          <circle class="g-track" cx="80" cy="80" r="70" fill="none" stroke-width="12"/>
          <circle class="g-fill" id="gauge-fill" cx="80" cy="80" r="70" fill="none" stroke-width="12"
                  stroke-linecap="round" stroke="${r.level.color}"
                  stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}"/>
        </svg>
        <div class="gauge-center"><span class="gauge-num"><span id="count">0</span><small>%</small></span></div>
      </div>

      <div class="score-body">
        <span class="badge" style="color:${r.level.color}">${r.level.label}</span>
        <p class="diag">${r.level.message}</p>
        <div class="level-bar">
          <div class="level-track" role="progressbar" aria-label="Porcentaje de madurez"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="${r.percent}">
            <div class="level-fill" id="level-fill" style="background:${r.level.color}"></div>
          </div>
          <div class="level-scale" aria-hidden="true">
            <span>0–39 Inicial</span><span>40–74 En desarrollo</span><span>75–100 Optimizado</span>
          </div>
        </div>
        <p class="f-txt" style="color:var(--muted); font-size:var(--fs-sm)">
          Puntuación: <span style="font-family:var(--font-data)">${r.total} / ${MAX_SCORE}</span> puntos
        </p>
      </div>
    </div>

    <div class="findings">
      <article class="panel finding">
        <h2><span class="dot" style="background:var(--lvl-high)"></span>Fortalezas</h2>
        <ul>${strengthsHTML}</ul>
      </article>
      <article class="panel finding">
        <h2><span class="dot" style="background:var(--lvl-mid)"></span>Oportunidades</h2>
        <ul>${oppsHTML}</ul>
      </article>
    </div>

    <section class="panel roadmap" aria-labelledby="road-title">
      <h2 id="road-title">Tu hoja de ruta</h2>
      <p>Tres pasos en orden. ${r.priority ? 'Marcamos dónde está tu mayor brecha.' : 'Todas tus dimensiones están consolidadas: úsala como guía de mejora continua.'}</p>
      <ol class="road">${roadHTML}</ol>
    </section>

    <div class="results-actions">
      <button type="button" class="btn btn-ghost btn-lg" data-action="reset">${ICON.reset} Reiniciar diagnóstico</button>
    </div>
  </section>`;
}

/* Animación del indicador: conteo 0 → X %, arco y barra de nivel */
function animateResults() {
  const panel = app.querySelector('.score-panel');
  const target = Number(panel.dataset.percent);
  const count = document.getElementById('count');
  const gauge = document.getElementById('gauge-fill');
  const bar = document.getElementById('level-fill');
  const C = 2 * Math.PI * 70;

  requestAnimationFrame(() => {
    gauge.style.strokeDashoffset = (C * (1 - target / 100)).toFixed(2);
    bar.style.width = target + '%';
  });

  if (reduceMotion) { count.textContent = target; return; }
  const duration = 800;
  const t0 = performance.now();
  const tick = now => {
    const p = Math.min(1, (now - t0) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    count.textContent = Math.round(target * eased);
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/* ==========================================================================
   Controladores de eventos (delegación sobre el contenedor único)
   ========================================================================== */
function startQuiz() {
  state = initialState();
  state.startedAt = Date.now();
  state.view = 'quiz';
  render();
}

function goNext() {
  if (isTransitioning || state.answers[state.currentIndex] === null) return;
  isTransitioning = true;
  if (state.currentIndex < QUESTIONS.length - 1) {
    state.currentIndex += 1;
    render();
  } else {
    state.finishedAt = Date.now();
    setView('results');
  }
  setTimeout(() => { isTransitioning = false; }, 250);
}

function goPrev() {
  if (isTransitioning || state.currentIndex === 0) return;
  state.currentIndex -= 1;
  render();
}

/* FN-04 · Restablecimiento de estado sin recargar la página */
function resetDiagnosis() {
  state = initialState();
  render();
}

app.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === 'start') startQuiz();
  if (action === 'prev')  goPrev();
  if (action === 'reset') resetDiagnosis();
});

// Selección de opción: guarda el valor y habilita "Siguiente" (respuesta < 100 ms)
app.addEventListener('change', e => {
  if (e.target.type !== 'radio') return;
  state.answers[state.currentIndex] = Number(e.target.value);
  const next = document.getElementById('btn-next');
  if (next) next.setAttribute('aria-disabled', 'false');
  const dots = app.querySelectorAll('.steps-dots span');
  if (dots[state.currentIndex]) dots[state.currentIndex].classList.add('done');
  const fill = document.getElementById('progress-fill');
  if (fill) fill.style.width = Math.round(((state.currentIndex + 1) / QUESTIONS.length) * 100) + '%';
});

// "Siguiente" / "Ver resultados" (también con Enter)
app.addEventListener('submit', e => {
  e.preventDefault();
  goNext();
});

/* Arranque: Vista 1 (Bienvenida) */
render();
</script>
